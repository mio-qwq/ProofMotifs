name: Exact research checks
on:
  push:
    branches: [main, research/ongoing]
  pull_request:
permissions:
  contents: read
concurrency:
  group: exact-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Replay deterministic experiments
        run: |
          python3 tools/run_experiments.py > /tmp/startup-results.json
          diff -u research/experiments/startup-results.json /tmp/startup-results.json
