name: Exact research checks
on:
  push:
    branches: [main, research/ongoing]
  pull_request:
permissions:
  contents: read
concurrency:
  group: exact-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Replay deterministic experiments
        run: |
          python3 tools/run_experiments.py > /tmp/startup-results.json
          diff -u research/experiments/startup-results.json /tmp/startup-results.json
      - name: Replay ternary classification
        run: |
          python3 tools/ternary_differences.py > /tmp/ternary-results.json
          diff -u research/experiments/ternary-results.json /tmp/ternary-results.json
      - name: Replay preserver classification experiments
        run: |
          python3 tools/order_preservers.py > /tmp/preserver-results.json
          diff -u research/experiments/preserver-results.json /tmp/preserver-results.json
      - name: Replay constructive witness experiments
        run: |
          python3 tools/constructive_witness.py > /tmp/constructive-results.json
          diff -u research/experiments/constructive-results.json /tmp/constructive-results.json
      - name: Replay generator witness experiments
        run: |
          python3 tools/generator_witness.py > /tmp/generator-results.json
          diff -u research/experiments/generator-results.json /tmp/generator-results.json
      - name: Replay nonadditive preserver experiments
        run: |
          python3 tools/nonadditive_preservers.py > /tmp/nonadditive-results.json
          diff -u research/experiments/nonadditive-results.json /tmp/nonadditive-results.json
      - name: Replay incidence rank certificates
        run: |
          python3 tools/incidence_rank_certificate.py > /tmp/incidence-rank-results.json
          diff -u research/experiments/incidence-rank-results.json /tmp/incidence-rank-results.json
      - name: Replay color certificate with independent arithmetic
        run: |
          python3 tools/color_refinement_certificate.py > /tmp/color-certificate.json
          diff -u research/experiments/color-certificate.json /tmp/color-certificate.json
          python3 tools/color_refinement_certificate.py --check research/experiments/color-certificate.json > /tmp/color-verification.json
          diff -u research/experiments/color-verification.json /tmp/color-verification.json
      - name: Replay Freiman completion controls
        run: |
          python3 tools/freiman_completion.py > /tmp/freiman-completion-results.json
          diff -u research/experiments/freiman-completion-results.json /tmp/freiman-completion-results.json
      - name: Replay cyclotomic incidence controls
        run: |
          python3 tools/cyclotomic_incidence.py > /tmp/cyclotomic-incidence-results.json
          diff -u research/experiments/cyclotomic-incidence-results.json /tmp/cyclotomic-incidence-results.json
      - name: Replay Fourier incidence spectra
        run: |
          python3 tools/fourier_incidence_spectrum.py > /tmp/fourier-incidence-spectrum.json
          diff -u research/experiments/fourier-incidence-spectrum.json /tmp/fourier-incidence-spectrum.json
      - name: Replay polynomial cyclic certificate
        run: |
          python3 tools/cyclic_incidence_certificate.py > /tmp/cyclic-incidence-certificate.json
          diff -u research/experiments/cyclic-incidence-certificate.json /tmp/cyclic-incidence-certificate.json
          python3 tools/cyclic_incidence_certificate.py --check research/experiments/cyclic-incidence-certificate.json > /tmp/cyclic-incidence-verification.json
          diff -u research/experiments/cyclic-incidence-verification.json /tmp/cyclic-incidence-verification.json
      - name: Replay two-subspace obstruction
        run: |
          python3 tools/two_subspace_obstruction.py > /tmp/two-subspace-results.json
          diff -u research/experiments/two-subspace-results.json /tmp/two-subspace-results.json
      - name: Replay single-orbit certificates
        run: |
          python3 tools/single_orbit_search.py > /tmp/single-orbit-report.json
          diff -u research/experiments/single-orbit-report.json /tmp/single-orbit-report.json
          python3 tools/single_orbit_search.py --check research/experiments/single-orbit-report.json > /tmp/single-orbit-verification.json
          diff -u research/experiments/single-orbit-verification.json /tmp/single-orbit-verification.json
      - name: Independently check connected-orbit polynomial gcd
        run: |
          python3 tools/single_orbit_independent_check.py > /tmp/single-orbit-independent-check.json
          diff -u research/experiments/single-orbit-independent-check.json /tmp/single-orbit-independent-check.json
      - name: Independently check nonlinear trace separator
        run: |
          python3 tools/single_orbit_trace_check.py > /tmp/single-orbit-trace-check.json
          diff -u research/experiments/single-orbit-trace-check.json /tmp/single-orbit-trace-check.json
      - name: Replay linearized odd-degree seed certificate
        run: |
          python3 tools/linearized_seed_certificate.py > /tmp/linearized-seed-certificate.json
          diff -u research/experiments/linearized-seed-certificate.json /tmp/linearized-seed-certificate.json
          python3 tools/linearized_seed_certificate.py --verify research/experiments/linearized-seed-certificate.json > /tmp/linearized-seed-verification.json
          diff -u research/experiments/linearized-seed-verification.json /tmp/linearized-seed-verification.json
      - name: Independently check odd-degree field and trace witness
        run: |
          python3 tools/linearized_seed_independent_check.py > /tmp/linearized-seed-independent-check.json
          diff -u research/experiments/linearized-seed-independent-check.json /tmp/linearized-seed-independent-check.json
      - name: Replay normal-character basecase certificate
        run: |
          python3 tools/normal_pattern_certificate.py > /tmp/normal-pattern-certificate.json
          diff -u research/experiments/normal-pattern-certificate.json /tmp/normal-pattern-certificate.json
          python3 tools/normal_pattern_certificate.py --check research/experiments/normal-pattern-certificate.json > /tmp/normal-pattern-verification.json
          diff -u research/experiments/normal-pattern-verification.json /tmp/normal-pattern-verification.json
      - name: Replay normal-character bound arithmetic
        run: |
          python3 tools/normal_character_bound.py > /tmp/normal-character-bound.json
          diff -u research/experiments/normal-character-bound.json /tmp/normal-character-bound.json
      - name: Replay normal quartic boundary
        run: |
          python3 tools/normal_quartic_boundary.py > /tmp/normal-quartic-boundary.json
          diff -u research/experiments/normal-quartic-boundary.json /tmp/normal-quartic-boundary.json
      - name: Independently check normal obstructions and quartic witness
        run: |
          python3 tools/normal_pattern_independent_check.py > /tmp/normal-pattern-independent-check.json
          diff -u research/experiments/normal-pattern-independent-check.json /tmp/normal-pattern-independent-check.json
      - name: Replay construction and interaction certificates
        run: |
          python3 tools/construction_contracts.py > /tmp/construction-contracts.json
          diff -u research/experiments/construction-contracts.json /tmp/construction-contracts.json
      - name: Replay triangle grammar and failed transfer
        run: |
          python3 tools/triangle_contracts.py > /tmp/triangle-contracts.json
          diff -u research/experiments/triangle-contracts.json /tmp/triangle-contracts.json
      - name: Independently check damaged construction hypotheses
        run: |
          python3 tools/construction_boundary_check.py > /tmp/construction-boundary-check.json
          diff -u research/experiments/construction-boundary-check.json /tmp/construction-boundary-check.json
      - name: Independently interpolate and check the hole Gram
        run: |
          python3 tools/construction_independent_field.py > /tmp/construction-independent-field.json
          diff -u research/experiments/construction-independent-field.json /tmp/construction-independent-field.json
      - name: Replay costed feature repair
        run: |
          python3 tools/feature_repair.py > /tmp/feature-repair-report.json
          diff -u research/experiments/feature-repair-report.json /tmp/feature-repair-report.json
      - name: Independently check repair masks and coefficient bounds
        run: |
          python3 tools/feature_repair_boundary.py > /tmp/feature-repair-boundary.json
          diff -u research/experiments/feature-repair-boundary.json /tmp/feature-repair-boundary.json
          python3 tools/feature_repair_independent.py > /tmp/feature-repair-independent.json
          diff -u research/experiments/feature-repair-independent.json /tmp/feature-repair-independent.json
          python3 tools/feature_repair_coefficient_bound.py > /tmp/feature-repair-coefficient-bound.json
          diff -u research/experiments/feature-repair-coefficient-bound.json /tmp/feature-repair-coefficient-bound.json
      - name: Cross-check independent repair solvers
        run: |
          python3 tools/feature_repair_reference.py > /tmp/feature-repair-reference.json
          diff -u research/experiments/feature-repair-reference.json /tmp/feature-repair-reference.json
          python3 tools/feature_repair_crosscheck.py > /tmp/feature-repair-crosscheck.log
          diff -u research/experiments/feature-repair-crosscheck.log /tmp/feature-repair-crosscheck.log
      - name: Replay separate monomial discovery calibration
        run: |
          python3 tools/feature_repair_monomial.py > /tmp/feature-repair-monomial-report.json
          diff -u research/experiments/feature-repair-monomial-report.json /tmp/feature-repair-monomial-report.json
          python3 tools/feature_repair_monomial_check.py > /tmp/feature-repair-monomial-check.json
          diff -u research/experiments/feature-repair-monomial-check.json /tmp/feature-repair-monomial-check.json
      - name: Replay exact succinct word certificates
        run: |
          python3 tools/reachable_series.py > /tmp/reachable-series-report.json
          diff -u research/experiments/reachable-series-report.json /tmp/reachable-series-report.json
      - name: Replay path-aware rational jet bounds
        run: |
          python3 tools/acyclic_jet.py --demo > /tmp/acyclic-jet-report.json
          diff -u research/experiments/acyclic-jet-report.json /tmp/acyclic-jet-report.json
      - name: Independently check DAG paths and characteristic parsing
        run: |
          python3 tools/acyclic_jet_independent.py > /tmp/acyclic-jet-independent.json
          diff -u research/experiments/acyclic-jet-independent.json /tmp/acyclic-jet-independent.json
      - name: Replay bounded constant-field algebra certificates
        run: |
          python3 tools/finite_algebra_jet.py > /tmp/finite-algebra-jet-report.json
          diff -u research/experiments/finite-algebra-jet-report.json /tmp/finite-algebra-jet-report.json
      - name: Independently check finite-algebra jet obstructions
        run: |
          python3 tools/finite_algebra_jet_independent.py > /tmp/finite-algebra-jet-independent.json
          diff -u research/experiments/finite-algebra-jet-independent.json /tmp/finite-algebra-jet-independent.json
      - name: Replay exact q-seed dictionary synthesis
        run: |
          python3 tools/q_seed_synthesis.py > /tmp/q-seed-report.json
          diff -u research/experiments/q-seed-report.json /tmp/q-seed-report.json
      - name: Independently check q-residues and positive characteristic
        run: |
          python3 tools/q_seed_independent.py > /tmp/q-seed-independent.json
          diff -u research/experiments/q-seed-independent.json /tmp/q-seed-independent.json
      - name: Replay polynomial-seed operator obstructions
        run: |
          python3 tools/q_polynomial_obstruction.py > /tmp/q-polynomial-report.json
          diff -u research/experiments/q-polynomial-report.json /tmp/q-polynomial-report.json
      - name: Independently check quantum-plane identities
        run: |
          python3 tools/q_polynomial_independent.py > /tmp/q-polynomial-independent.json
          diff -u research/experiments/q-polynomial-independent.json /tmp/q-polynomial-independent.json
      - name: Replay universal resolvent transport certificate
        run: |
          python3 tools/resolvent_certificate.py > /tmp/resolvent-certificate.json
          diff -u research/experiments/resolvent-certificate.json /tmp/resolvent-certificate.json
      - name: Independently check mixed rational seed identities
        run: |
          python3 tools/mixed_seed_independent_b.py > /tmp/mixed-seed-independent-b.log
          diff -u research/experiments/mixed-seed-independent-b.log /tmp/mixed-seed-independent-b.log
          python3 tools/mixed_seed_independent_c.py > /tmp/mixed-seed-independent-c.log
          diff -u research/experiments/mixed-seed-independent-c.log /tmp/mixed-seed-independent-c.log
      - name: Replay implicit minimum-degree representation
        run: |
          python3 tools/implicit_evaluation.py > /tmp/implicit-evaluation.json
          diff -u research/experiments/implicit-evaluation.json /tmp/implicit-evaluation.json
      - name: Independently check degree-safe frontier closure
        run: |
          python3 tools/implicit_independent_a.py > /tmp/implicit-independent-a.log
          diff -u research/experiments/implicit-independent-a.log /tmp/implicit-independent-a.log
      - name: Independently check cardinal maps and Gram transfer
        run: |
          python3 tools/implicit_independent_b.py > /tmp/implicit-independent-b.log
          diff -u research/experiments/implicit-independent-b.log /tmp/implicit-independent-b.log
      - name: Adversarially check implicit pruning and degree completeness
        run: |
          python3 tools/implicit_independent_c.py > /tmp/implicit-independent-c.log
          diff -u research/experiments/implicit-independent-c.log /tmp/implicit-independent-c.log
      - name: Replay known-label factor readout
        run: |
          python3 tools/factor_readout.py > /tmp/factor-readout.json
          diff -u research/experiments/factor-readout.json /tmp/factor-readout.json
      - name: Replay conditional orientation construction
        run: |
          python3 tools/orientation_readout.py > /tmp/orientation-readout.json
          diff -u research/experiments/orientation-readout.json /tmp/orientation-readout.json
      - name: Replay adaptive discrete readout
        run: |
          python3 tools/dynamic_readout.py > /tmp/dynamic-readout.json
          diff -u research/experiments/dynamic-readout.json /tmp/dynamic-readout.json
      - name: Independently check quotient and scalar-label certificates
        run: |
          python3 tools/factor_independent_a.py > /tmp/factor-independent-a.log
          diff -u research/experiments/factor-independent-a.log /tmp/factor-independent-a.log
      - name: Independently check supplied readout families
        run: |
          python3 tools/factor_independent_b.py > /tmp/factor-independent-b.log
          diff -u research/experiments/factor-independent-b.log /tmp/factor-independent-b.log
      - name: Independently challenge factor and primary hypotheses
        run: |
          python3 tools/factor_independent_c.py > /tmp/factor-independent-c.log
          diff -u research/experiments/factor-independent-c.log /tmp/factor-independent-c.log
      - name: Cross-check factor readout with separate exact oracles
        run: |
          python3 tools/factor_oracle_audit.py > /tmp/factor-oracle-audit.log
          diff -u research/experiments/factor-oracle-audit.log /tmp/factor-oracle-audit.log
      - name: Independently audit high-primary orientation masks
        run: |
          python3 tools/orientation_high_primary_audit.py > /tmp/orientation-high-primary.json
          diff -u research/experiments/orientation-high-primary.json /tmp/orientation-high-primary.json
