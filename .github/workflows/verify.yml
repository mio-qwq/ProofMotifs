name: Exact research checks
on:
  push:
    branches: [main, research/ongoing]
  pull_request:
permissions:
  contents: read
concurrency:
  group: exact-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Replay deterministic experiments
        run: |
          python3 tools/run_experiments.py > /tmp/startup-results.json
          diff -u research/experiments/startup-results.json /tmp/startup-results.json
      - name: Replay ternary classification
        run: |
          python3 tools/ternary_differences.py > /tmp/ternary-results.json
          diff -u research/experiments/ternary-results.json /tmp/ternary-results.json
      - name: Replay preserver classification experiments
        run: |
          python3 tools/order_preservers.py > /tmp/preserver-results.json
          diff -u research/experiments/preserver-results.json /tmp/preserver-results.json
      - name: Replay constructive witness experiments
        run: |
          python3 tools/constructive_witness.py > /tmp/constructive-results.json
          diff -u research/experiments/constructive-results.json /tmp/constructive-results.json
      - name: Replay generator witness experiments
        run: |
          python3 tools/generator_witness.py > /tmp/generator-results.json
          diff -u research/experiments/generator-results.json /tmp/generator-results.json
      - name: Replay nonadditive preserver experiments
        run: |
          python3 tools/nonadditive_preservers.py > /tmp/nonadditive-results.json
          diff -u research/experiments/nonadditive-results.json /tmp/nonadditive-results.json
      - name: Replay incidence rank certificates
        run: |
          python3 tools/incidence_rank_certificate.py > /tmp/incidence-rank-results.json
          diff -u research/experiments/incidence-rank-results.json /tmp/incidence-rank-results.json
      - name: Replay color certificate with independent arithmetic
        run: |
          python3 tools/color_refinement_certificate.py > /tmp/color-certificate.json
          diff -u research/experiments/color-certificate.json /tmp/color-certificate.json
          python3 tools/color_refinement_certificate.py --check research/experiments/color-certificate.json > /tmp/color-verification.json
          diff -u research/experiments/color-verification.json /tmp/color-verification.json
      - name: Replay Freiman completion controls
        run: |
          python3 tools/freiman_completion.py > /tmp/freiman-completion-results.json
          diff -u research/experiments/freiman-completion-results.json /tmp/freiman-completion-results.json
      - name: Replay cyclotomic incidence controls
        run: |
          python3 tools/cyclotomic_incidence.py > /tmp/cyclotomic-incidence-results.json
          diff -u research/experiments/cyclotomic-incidence-results.json /tmp/cyclotomic-incidence-results.json
      - name: Replay Fourier incidence spectra
        run: |
          python3 tools/fourier_incidence_spectrum.py > /tmp/fourier-incidence-spectrum.json
          diff -u research/experiments/fourier-incidence-spectrum.json /tmp/fourier-incidence-spectrum.json
      - name: Replay polynomial cyclic certificate
        run: |
          python3 tools/cyclic_incidence_certificate.py > /tmp/cyclic-incidence-certificate.json
          diff -u research/experiments/cyclic-incidence-certificate.json /tmp/cyclic-incidence-certificate.json
          python3 tools/cyclic_incidence_certificate.py --check research/experiments/cyclic-incidence-certificate.json > /tmp/cyclic-incidence-verification.json
          diff -u research/experiments/cyclic-incidence-verification.json /tmp/cyclic-incidence-verification.json
      - name: Replay two-subspace obstruction
        run: |
          python3 tools/two_subspace_obstruction.py > /tmp/two-subspace-results.json
          diff -u research/experiments/two-subspace-results.json /tmp/two-subspace-results.json
      - name: Replay single-orbit certificates
        run: |
          python3 tools/single_orbit_search.py > /tmp/single-orbit-report.json
          diff -u research/experiments/single-orbit-report.json /tmp/single-orbit-report.json
          python3 tools/single_orbit_search.py --check research/experiments/single-orbit-report.json > /tmp/single-orbit-verification.json
          diff -u research/experiments/single-orbit-verification.json /tmp/single-orbit-verification.json
      - name: Independently check connected-orbit polynomial gcd
        run: |
          python3 tools/single_orbit_independent_check.py > /tmp/single-orbit-independent-check.json
          diff -u research/experiments/single-orbit-independent-check.json /tmp/single-orbit-independent-check.json
      - name: Independently check nonlinear trace separator
        run: |
          python3 tools/single_orbit_trace_check.py > /tmp/single-orbit-trace-check.json
          diff -u research/experiments/single-orbit-trace-check.json /tmp/single-orbit-trace-check.json
      - name: Replay linearized odd-degree seed certificate
        run: |
          python3 tools/linearized_seed_certificate.py > /tmp/linearized-seed-certificate.json
          diff -u research/experiments/linearized-seed-certificate.json /tmp/linearized-seed-certificate.json
          python3 tools/linearized_seed_certificate.py --verify research/experiments/linearized-seed-certificate.json > /tmp/linearized-seed-verification.json
          diff -u research/experiments/linearized-seed-verification.json /tmp/linearized-seed-verification.json
      - name: Independently check odd-degree field and trace witness
        run: |
          python3 tools/linearized_seed_independent_check.py > /tmp/linearized-seed-independent-check.json
          diff -u research/experiments/linearized-seed-independent-check.json /tmp/linearized-seed-independent-check.json
      - name: Replay normal-character basecase certificate
        run: |
          python3 tools/normal_pattern_certificate.py > /tmp/normal-pattern-certificate.json
          diff -u research/experiments/normal-pattern-certificate.json /tmp/normal-pattern-certificate.json
          python3 tools/normal_pattern_certificate.py --check research/experiments/normal-pattern-certificate.json > /tmp/normal-pattern-verification.json
          diff -u research/experiments/normal-pattern-verification.json /tmp/normal-pattern-verification.json
      - name: Replay normal-character bound arithmetic
        run: |
          python3 tools/normal_character_bound.py > /tmp/normal-character-bound.json
          diff -u research/experiments/normal-character-bound.json /tmp/normal-character-bound.json
      - name: Replay normal quartic boundary
        run: |
          python3 tools/normal_quartic_boundary.py > /tmp/normal-quartic-boundary.json
          diff -u research/experiments/normal-quartic-boundary.json /tmp/normal-quartic-boundary.json
      - name: Independently check normal obstructions and quartic witness
        run: |
          python3 tools/normal_pattern_independent_check.py > /tmp/normal-pattern-independent-check.json
          diff -u research/experiments/normal-pattern-independent-check.json /tmp/normal-pattern-independent-check.json
